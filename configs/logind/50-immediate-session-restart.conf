[Login]
# unattended-upgrades raises InhibitDelayMaxSec to 30. logind then announces
# the reboot and emits PrepareForShutdown while delay inhibitors are still
# held. GNOME treats that signal as success and ends the desktop session, so
# the login screen appears and reboot.target never starts. A zero maximum
# starts Restart and Power Off immediately.
InhibitDelayMaxSec=0
