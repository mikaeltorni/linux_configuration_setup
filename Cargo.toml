[package]
name = "lcs-tools"
version = "0.1.0"
edition = "2021"
description = "Installer helpers for linux-configuration-setup"
license = "MIT"
publish = false

[[bin]]
name = "lcs-tools"
path = "src/main.rs"

[[bin]]
name = "gdm-x11"
path = "src/bin/gdm-x11.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
